<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conju-Coach DELF Pro</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        cream: '#F7F4EF',
                        warmwhite: '#FAFAFA',
                        ink: '#1A1A1A',
                        nuit: '#0B1B3D',
                        bordeaux: '#6B2D3E',
                        gold: '#C9A84C',
                    },
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #FAFAFA; color: #1A1A1A; }
        .font-display { font-family: 'Playfair Display', serif; }
        .step { display: none; flex-direction: column; gap: 15px; animation: fadeIn 0.3s; }
        .step.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

<div class="w-[95%] max-w-[550px] rounded-[2rem] bg-white shadow-[0_8px_50px_rgba(0,0,0,0.06)] p-8 sm:p-10 my-6">

    <h1 class="font-display text-3xl font-bold text-center text-nuit mb-6">Conju-Coach ✍️</h1>

    <!-- 0. LANGUE -->
    <div id="step-lang" class="step active">
        <p class="text-center font-display text-xl text-nuit">Choisissez votre langue<br><span class="text-sm font-body text-ink/40">언어를 선택하세요</span></p>
        <div class="grid grid-cols-2 gap-4">
            <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-6 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.setLang('fr')">Français 🇫🇷</button>
            <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-6 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.setLang('ko')">한국어 🇰🇷</button>
        </div>
    </div>

    <!-- 1. LOGIN -->
    <div id="step-login" class="step">
        <p id="label-login" class="font-display text-2xl font-semibold text-center text-nuit">Qui est là ?</p>
        <input type="text" id="student-name-input" autocomplete="off" placeholder="Ton prénom ici" class="rounded-[1.5rem] border border-ink/5 bg-cream px-6 py-4 text-center text-lg text-ink outline-none focus:ring-2 focus:ring-nuit/10 transition-all">
        <button class="btn-full rounded-[1.5rem] bg-nuit px-6 py-4 text-base font-semibold text-white shadow-[0_4px_25px_rgba(11,27,61,0.2)] hover:shadow-[0_8px_40px_rgba(11,27,61,0.25)] hover:-translate-y-[1px] transition-all" onclick="window.validateStudent()">C'est parti !</button>
        <p id="login-status" class="text-center text-sm text-ink/40 italic"></p>
    </div>

    <!-- 2. MENU PRINCIPAL -->
    <div id="step-main-menu" class="step">
        <button id="btn-menu-classic" class="btn-full rounded-[1.5rem] bg-nuit px-6 py-5 text-base font-semibold text-white shadow-[0_4px_25px_rgba(11,27,61,0.2)] hover:shadow-[0_8px_40px_rgba(11,27,61,0.25)] hover:-translate-y-[1px] transition-all" onclick="window.goToStep('step-level')">🎯 Entraînement Classique</button>
        <button id="btn-menu-challenge" class="btn-full rounded-[1.5rem] bg-bordeaux px-6 py-5 text-base font-semibold text-white shadow-[0_4px_25px_rgba(107,45,62,0.2)] hover:shadow-[0_8px_40px_rgba(107,45,62,0.25)] hover:-translate-y-[1px] transition-all" onclick="window.goToStep('step-challenges')">🔥 Challenges (Défis)</button>
        <button id="btn-menu-conj" class="btn-full rounded-[1.5rem] bg-ink px-6 py-5 text-base font-semibold text-white shadow-[0_4px_25px_rgba(0,0,0,0.15)] hover:shadow-[0_8px_40px_rgba(0,0,0,0.2)] hover:-translate-y-[1px] transition-all" onclick="window.goToStep('step-conj')">📖 Conjugueur</button>
        <button id="btn-menu-gamification" class="btn-full rounded-[1.5rem] bg-gold px-6 py-5 text-base font-semibold text-white shadow-[0_4px_25px_rgba(201,168,76,0.25)] hover:shadow-[0_8px_40px_rgba(201,168,76,0.3)] hover:-translate-y-[1px] transition-all" onclick="window.goToStep('step-gamification')">🏆 Rangs & Succès</button>
        <button id="btn-menu-lb" class="btn-full rounded-[1.5rem] bg-ink/70 px-6 py-5 text-base font-semibold text-white shadow-[0_4px_25px_rgba(0,0,0,0.1)] hover:shadow-[0_8px_40px_rgba(0,0,0,0.15)] hover:-translate-y-[1px] transition-all" onclick="window.loadLeaderboard()">🏆 Classements</button>
    </div>

    <!-- 3. GAMIFICATION -->
    <div id="step-gamification" class="step">
        <h2 class="font-display text-2xl font-semibold text-center text-nuit">🏆 Mon Progrès</h2>
        <div id="gamification-rank" class="rounded-[1.5rem] bg-gradient-to-br from-nuit to-ink p-7 text-center"></div>
        <h3 class="font-display text-xl font-semibold text-center text-nuit mt-2">🏅 Succès</h3>
        <div id="gamification-achievements" class="flex flex-col gap-2"></div>
        <h3 class="font-display text-xl font-semibold text-center text-nuit mt-2">🏅 Classement des rangs</h3>
        <div id="rank-leaderboard"></div>
        <button class="btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 4. CHOIX NIVEAU -->
    <div id="step-level" class="step">
        <h2 id="label-level" class="font-display text-2xl font-semibold text-center text-nuit">-</h2>
        <div class="grid grid-cols-2 gap-4">
            <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-5 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.selectLevel('A1')">A1</button>
            <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-5 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.selectLevel('A2')">A2</button>
            <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-5 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.selectLevel('B1')">B1</button>
            <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-5 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.selectLevel('B2')">B2</button>
        </div>
        <button id="btn-custom-trigger" class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-5 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98] w-full text-center" onclick="window.openCustomMode()">-</button>
        <button class="btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 5. CHALLENGES -->
    <div id="step-challenges" class="step">
        <h2 class="font-display text-2xl font-semibold text-center text-nuit">🔥 Modes de Jeu</h2>
        <div class="grid grid-cols-2 gap-4">
            <button id="btn-mode-sd" class="btn-choice challenge-btn rounded-[1.5rem] border border-ink/5 bg-white px-4 py-5 text-sm font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.selectChallengeMode('sudden-death', this)">☠️ <span id="txt-sd">Mort Subite</span></button>
            <button id="btn-mode-ta" class="btn-choice challenge-btn rounded-[1.5rem] border border-ink/5 bg-white px-4 py-5 text-sm font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.selectChallengeMode('time-attack', this)">⏱️ <span id="txt-ta">Time Attack</span></button>
        </div>
        <button id="btn-mode-ta-all" class="btn-choice challenge-btn rounded-[1.5rem] border border-ink/5 bg-white px-4 py-5 text-sm font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98] w-full text-center" onclick="window.selectChallengeMode('time-attack-weighted', this)">🌟 <span id="txt-ta-all">Time Attack (Tous verbes)</span></button>
        <div id="challenge-level-select" style="display:none; margin-top:15px; border-top:1px dashed rgba(0,0,0,0.08); padding-top:20px;">
            <p id="label-challenge-lvl" class="font-display text-lg font-medium text-center text-nuit mb-3">Choisissez le niveau :</p>
            <div class="grid grid-cols-2 gap-4">
                <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-4 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.startChallengeGame('A1')">A1</button>
                <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-4 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.startChallengeGame('A2')">A2</button>
                <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-4 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.startChallengeGame('B1')">B1</button>
                <button class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-4 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98]" onclick="window.startChallengeGame('B2')">B2</button>
            </div>
        </div>
        <button class="btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 6. CUSTOM -->
    <div id="step-custom" class="step">
        <p id="label-tenses" class="font-display text-xl text-center text-nuit">-</p>
        <div class="grid grid-cols-2 gap-3" id="tense-buttons"></div>
        <div id="custom-sliders-container"></div>
        <button id="btn-custom-next" class="btn-full rounded-[1.5rem] bg-nuit px-6 py-4 text-base font-semibold text-white shadow-[0_4px_25px_rgba(11,27,61,0.2)] hover:shadow-[0_8px_40px_rgba(11,27,61,0.25)] hover:-translate-y-[1px] transition-all" onclick="window.confirmCustomTenses()">-</button>
        <button class="btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.goToStep('step-level')">➔ Retour</button>
    </div>

    <!-- 7. CLASSEMENT -->
    <div id="step-leaderboard" class="step">
        <h2 id="label-lb-title" class="font-display text-2xl font-semibold text-center text-nuit">🏆 Top Scores</h2>
        <div class="flex gap-2">
            <select id="lb-time" onchange="window.updateLeaderboardView()" class="flex-1 rounded-[1rem] border border-ink/5 bg-cream px-3 py-3 text-sm font-medium text-ink outline-none focus:ring-2 focus:ring-nuit/10">
                <option id="opt-time-week" value="week">Semaine</option>
                <option id="opt-time-month" value="month">Mois</option>
                <option id="opt-time-all" value="all">All-Time</option>
            </select>
            <select id="lb-mode" onchange="window.updateLeaderboardView()" class="flex-1 rounded-[1rem] border border-ink/5 bg-cream px-3 py-3 text-sm font-medium text-ink outline-none focus:ring-2 focus:ring-nuit/10">
                <option id="opt-mode-sd" value="sudden-death">Mort Subite</option>
                <option id="opt-mode-ta" value="time-attack">Time Attack</option>
                <option id="opt-mode-ta-all" value="time-attack-weighted">Time Attack (Tous les verbes)</option>
            </select>
        </div>
        <select id="lb-level" onchange="window.updateLeaderboardView()" class="rounded-[1rem] border border-ink/5 bg-cream px-3 py-3 text-sm font-medium text-ink outline-none focus:ring-2 focus:ring-nuit/10">
            <option value="A1">Niveau A1</option><option value="A2">Niveau A2</option><option value="B1">Niveau B1</option><option value="B2">Niveau B2</option>
        </select>
        <div id="leaderboard-content" style="min-height:200px; overflow-y:auto;"></div>
        <button class="btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 8. QUANTITÉ -->
    <div id="step-quantity" class="step">
        <p id="label-quantity" class="font-display text-xl text-center text-nuit">-</p>
        <input type="number" id="nb-verbes" value="10" min="1" max="50" class="rounded-[1.5rem] border border-ink/5 bg-cream px-6 py-4 text-center text-lg text-ink outline-none focus:ring-2 focus:ring-nuit/10 transition-all">
        <div class="flex gap-3">
            <button id="btn-infinite" class="btn-choice rounded-[1.5rem] border border-ink/5 bg-white px-6 py-4 text-base font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98] flex-1 text-center" onclick="window.startClassic(999)">-</button>
            <button id="btn-start" class="btn-full rounded-[1.5rem] bg-nuit px-6 py-4 text-base font-semibold text-white shadow-[0_4px_25px_rgba(11,27,61,0.2)] hover:shadow-[0_8px_40px_rgba(11,27,61,0.25)] hover:-translate-y-[1px] transition-all flex-[2] text-center" onclick="window.startClassic()"></button>
        </div>
    </div>

    <!-- 9. JEU -->
    <div id="step-game" class="step">
        <div id="game-progress" class="text-right text-sm font-semibold text-nuit/60">0 / 10</div>
        <div id="game-timer" class="hidden text-center text-3xl font-bold text-bordeaux">⏳ 01:00</div>
        <div class="rounded-[1.5rem] border-2 border-nuit/5 bg-gradient-to-b from-white to-cream p-7 text-center">
            <div id="verb-name" class="font-display text-3xl font-bold text-nuit uppercase tracking-wide">---</div>
            <span id="verb-traduction" class="block mb-3 text-sm text-ink/35 italic"></span>
            <span id="tense-display" class="block my-3 text-xl font-semibold text-gold">-</span>
            <div id="pronoun" class="text-xl font-semibold text-ink my-3">---</div>
            <input type="text" id="answer-input" autocomplete="off" spellcheck="false" class="rounded-[1rem] border border-ink/5 bg-white w-full py-4 text-center text-xl text-ink outline-none focus:ring-2 focus:ring-nuit/10 transition-all">
            <div class="flex justify-center gap-2 flex-wrap mt-4">
                <button class="key rounded-xl border border-ink/5 bg-white px-4 py-2.5 text-base font-semibold text-ink shadow-[0_1px_5px_rgba(0,0,0,0.03)] hover:-translate-y-[1px] transition-all" onclick="window.insertChar('é')">é</button>
                <button class="key rounded-xl border border-ink/5 bg-white px-4 py-2.5 text-base font-semibold text-ink shadow-[0_1px_5px_rgba(0,0,0,0.03)] hover:-translate-y-[1px] transition-all" onclick="window.insertChar('è')">è</button>
                <button class="key rounded-xl border border-ink/5 bg-white px-4 py-2.5 text-base font-semibold text-ink shadow-[0_1px_5px_rgba(0,0,0,0.03)] hover:-translate-y-[1px] transition-all" onclick="window.insertChar('à')">à</button>
                <button class="key rounded-xl border border-ink/5 bg-white px-4 py-2.5 text-base font-semibold text-ink shadow-[0_1px_5px_rgba(0,0,0,0.03)] hover:-translate-y-[1px] transition-all" onclick="window.insertChar('â')">â</button>
                <button class="key rounded-xl border border-ink/5 bg-white px-4 py-2.5 text-base font-semibold text-ink shadow-[0_1px_5px_rgba(0,0,0,0.03)] hover:-translate-y-[1px] transition-all" onclick="window.insertChar('ç')">ç</button>
                <button class="key rounded-xl border border-ink/5 bg-white px-4 py-2.5 text-base font-semibold text-ink shadow-[0_1px_5px_rgba(0,0,0,0.03)] hover:-translate-y-[1px] transition-all" onclick="window.insertChar('ê')">ê</button>
                <button class="key rounded-xl border border-ink/5 bg-white px-4 py-2.5 text-base font-semibold text-ink shadow-[0_1px_5px_rgba(0,0,0,0.03)] hover:-translate-y-[1px] transition-all" onclick="window.insertChar('î')">î</button>
            </div>
        </div>
        <button id="btn-submit" class="btn-full rounded-[1.5rem] bg-nuit px-6 py-4 text-base font-semibold text-white shadow-[0_4px_25px_rgba(11,27,61,0.2)] hover:shadow-[0_8px_40px_rgba(11,27,61,0.25)] hover:-translate-y-[1px] transition-all" onclick="window.checkAnswer()">Vérifier</button>
        <button id="btn-stop-infinite" class="hidden btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.stopGame()">Terminer</button>
        <div id="feedback" class="min-h-[40px] text-center font-semibold text-lg mt-3"></div>
    </div>

    <!-- 10. RÉSULTATS -->
    <div id="step-results" class="step">
        <div class="text-center">
            <div id="final-score" class="font-display text-5xl font-bold text-nuit">0</div>
            <p id="final-percent" class="font-semibold text-lg text-ink/60 mt-2">-</p>
        </div>
        <div id="results-leaderboard" style="display:none;">
            <h3 id="label-top10" class="font-display text-xl font-semibold text-center text-nuit mb-3">🏆 Top 10 Actuel</h3>
            <div id="mini-leaderboard-content"></div>
        </div>
        <div class="flex flex-col gap-2">
            <textarea id="user-comment" rows="2" placeholder="Un petit message ?" class="rounded-[1rem] border border-ink/5 bg-cream w-full px-4 py-3 text-sm text-ink outline-none focus:ring-2 focus:ring-nuit/10"></textarea>
            <button id="btn-kakao" class="btn-full rounded-[1.5rem] bg-gold px-6 py-4 text-base font-semibold text-white shadow-[0_4px_25px_rgba(201,168,76,0.25)] hover:shadow-[0_8px_40px_rgba(201,168,76,0.3)] hover:-translate-y-[1px] transition-all" onclick="window.sendKakao()"></button>
        </div>
        <button id="btn-restart" class="btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.resetToMenu()">Recommencer</button>
        <div id="mistake-container"></div>
    </div>

    <!-- 11. CONJUGUEUR -->
    <div id="step-conj" class="step">
        <p id="label-search" class="font-display text-xl text-center text-nuit"></p>
        <input type="text" id="search-input" oninput="window.updateSuggestions()" autocomplete="off" class="rounded-[1.5rem] border border-ink/5 bg-cream px-6 py-4 text-center text-base text-ink outline-none focus:ring-2 focus:ring-nuit/10 transition-all">
        <div id="suggestions" style="display:none; max-height:100px; overflow:auto;" class="rounded-[1rem] border border-ink/5 bg-white shadow-[0_2px_15px_rgba(0,0,0,0.03)]"></div>
        <div id="conj-results" style="margin-top:20px; overflow-y:auto; max-height:350px;"></div>
        <button class="btn-full rounded-[1.5rem] bg-ink/5 px-6 py-4 text-base font-medium text-ink/50 hover:bg-ink/10 transition-all" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAG9xp3A4pdA-Cbt1qh8uM4tfC7f_1-MXY",
        authDomain: "conjugueur-72dd9.firebaseapp.com",
        databaseURL: "https://conjugueur-72dd9-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "conjugueur-72dd9",
        storageBucket: "conjugueur-72dd9.firebasestorage.app",

        if(sf.map(f=>f.toLowerCase()).includes(val)){
            correctAnswers++; currentStreak++;
            let pts=1; if(gameMode==='time-attack-weighted'){ const l=currentV.niveau||"A1"; pts=(l==='A2')?2:(l==='B1')?3:(l==='B2')?5:1; }
            score+=pts; addXP(5); if(rt<3000) unlockAchievement('quick_answer');
            let pt=gameMode==='time-attack-weighted'?` (+${pts} pts)`:'';
            document.getElementById('feedback').innerHTML=`<span style="color:#2ecc71">${i18n[currentLang].successMsg}${pt}</span>`;
            setTimeout(window.initJeu,800);
        } else {
            currentStreak=0; const sd=sf.join(' / ');
            document.getElementById('feedback').innerHTML=`<span style="color:#e74c3c">${i18n[currentLang].errorMsg} <b>${sd}</b></span>`;
            mistakeTracker.push({verb:currentV,tense:currentTense,errorIdx:currentPIdx,userAnswer:val});
            if(gameMode==='sudden-death'){ if(timerInterval) clearInterval(timerInterval); setTimeout(window.showResults,2000); } else { setTimeout(window.initJeu,2000); }
        }
    };

    window.stopGame = function(){ if(timerInterval) clearInterval(timerInterval); window.showResults(); };

    window.showResults = function() {
        if(timerInterval) clearInterval(timerInterval); window.goToStep('step-results');
        if(mistakeTracker.length===0) addXP(20); if(gameMode!=='classic') addXP(10); if(gameMode.includes('time-attack')&&timeLeft>0) addXP(timeLeft);
        if(gameMode!=='classic') database.ref('scores').push({pseudo:studentName||"Anonyme",score:score,mode:gameMode,level:gameMode==='time-attack-weighted'?'all':selectedLevel,time:Date.now()});
        const sr=total>0?Math.round((correctAnswers/total)*100):0;
        if(gameMode==='time-attack-weighted'){ document.getElementById('final-score').innerText=`${score} pts`; document.getElementById('final-percent').innerText=`${sr}% ${i18n[currentLang].statsLabel} (${total} ${i18n[currentLang].verbsAttempted})`; }
        else if(gameMode==='time-attack'||gameMode==='sudden-death'){ document.getElementById('final-score').innerText=`${score}`; document.getElementById('final-percent').innerText=`${sr}% ${i18n[currentLang].statsLabel} (${total} ${i18n[currentLang].verbsAttempted})`; }
        else { document.getElementById('final-score').innerText=`${score} / ${total}`; document.getElementById('final-percent').innerText=`${sr}% ${i18n[currentLang].statsLabel}`; }

        const c=document.getElementById('mistake-container');
        c.innerHTML=mistakeTracker.length>0?`<h3 class="font-display text-xl text-nuit text-center mb-3">${i18n[currentLang].reviewTitle}</h3>`:`<h3 class="font-display text-xl text-nuit text-center">${i18n[currentLang].perfectMsg}</h3>`;
        mistakeTracker.forEach(m=>{
            const dt=(currentLang==='ko')?(tenseMap[m.tense]?.ko||m.tense):m.tense;
            let h=`<div class="rounded-[1.5rem] border border-ink/5 bg-white p-5 mb-5"><h3 class="font-display text-lg text-nuit mb-2">${m.verb.verbe} - ${dt}</h3><table class="w-full text-sm">`;
            m.verb.conjugaisons[m.tense].forEach((raw,idx)=>{
                if(raw){ const fm=getValidForms(raw); const df=fm.join(' / ');
                    h+=`<tr class="${idx===m.errorIdx?'bg-red-50 text-red-500 font-semibold':'border-b border-ink/5'}"><td class="p-2 text-nuit/60">${window.getPronoun(idx,fm[0],m.tense)}</td><td class="p-2">${df}</td></tr>`;
                }
            });
            c.innerHTML+=h+"</table></div>";
        });
        checkAchievements();
        if(isAuthorizedStudent) saveDetailedReport();
        if(gameMode!=='classic') window.loadMiniLeaderboard(); else document.getElementById('results-leaderboard').style.display='none';
    };

    function saveDetailedReport() {
        database.ref('studentReports/'+studentName.toLowerCase()).push({
            student:studentName,mode:gameMode,level:gameMode==='time-attack-weighted'?'all':selectedLevel,score:score,total:total,correctAnswers:correctAnswers,successRate:total>0?Math.round((correctAnswers/total)*100):0,timestamp:Date.now(),
            mistakes:mistakeTracker.map(m=>{ const fm=getValidForms(m.verb.conjugaisons[m.tense][m.errorIdx]); return {verbe:m.verb.verbe,temps:m.tense,pronom:pronoms[m.errorIdx],formeCorrecte:fm[0],reponseEleve:m.userAnswer}; })
        });
    }

    window.sendKakao = function() {
        unlockAchievement('share_once');
        let modeKo=gameMode==='classic'?'기본 연습':gameMode==='sudden-death'?'서든 데스':gameMode==='time-attack'?'타임 어택':'타임 어택 (모든 동사)';
        let modeFr=gameMode==='classic'?'Classique':gameMode==='sudden-death'?'Mort Subite':gameMode==='time-attack'?'Time Attack':'Time Attack (Tous les verbes)';
        let uc=document.getElementById('user-comment').value, ld=selectedLevel==='all'?'Tous / 전체':selectedLevel;
        const sr=total>0?Math.round((correctAnswers/total)*100):0;
        let msg=currentLang==='ko'?`🏆 [Conju-Coach 결과]\n• 모드: ${modeKo}\n• 레벨: ${ld}\n• 점수: ${score}\n• 성공률: ${sr}%\n• 시도한 동사: ${total}\n💬 메시지: ${uc||"없음"}\n`:`🏆 [Résultat Conju-Coach]\n• Mode : ${modeFr}\n• Niveau : ${ld}\n• Score : ${score}\n• Taux de réussite : ${sr}%\n• Total tentés : ${total}\n💬 Message : ${uc||"Aucun"}\n`;
        if(mistakeTracker.length>0){ msg+=currentLang==='ko'?`\n❌ 틀린 동사 복습 :\n`:`\n❌ Erreurs à réviser :\n`; mistakeTracker.forEach(m=>{ const fm=getValidForms(m.verb.conjugaisons[m.tense][m.errorIdx]); const p=window.getPronoun(m.errorIdx,fm[0],m.tense).trim(); msg+=`- ${m.verb.verbe.toUpperCase()} (${m.tense}) -> ${p} ${fm.join('/')}\n`; }); }
        else { msg+=currentLang==='ko'?`\n🏆 오답 없음! 완벽해요!`:`\n🏆 Zéro faute ! Parfait !`; }
        if(navigator.share){ navigator.share({title:'Conju-Coach',text:msg}).catch(()=>fallbackCopy(msg)); } else { fallbackCopy(msg); }
    };

    function fallbackCopy(text) { const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); alert(currentLang==='ko'?"복사되었습니다! 💛":"Copié ! 💛"); } catch(e){ alert("Erreur de copie."); } document.body.removeChild(ta); }

    window.loadMiniLeaderboard = function() {
        document.getElementById('results-leaderboard').style.display='block';
        document.getElementById('mini-leaderboard-content').innerHTML=`<p class="text-center text-ink/40 py-4">Chargement...</p>`;
        database.ref('scores').once('value').then(snap=>{ let sl=[]; snap.forEach(c=>{ let s=c.val(); let el=(gameMode==='time-attack-weighted')?'all':selectedLevel; if(getNormalizedMode(s.mode)===getNormalizedMode(gameMode)&&s.level===el) sl.push(s); }); sl.sort((a,b)=>(parseInt(b.score||b.val)||0)-(parseInt(a.score||a.val)||0)); let html=`<table class="w-full text-sm rounded-[1rem] overflow-hidden border border-ink/5"><tr class="bg-nuit text-white"><th class="p-3 text-left">#</th><th class="p-3 text-left">Nom</th><th class="p-3 text-left">Score</th></tr>`; sl.slice(0,10).forEach((s,i)=>{ let v=gameMode==='time-attack-weighted'?`${s.score||s.val} pts`:(s.score||s.val); html+=`<tr class="border-b border-ink/5"><td class="p-3">${['🥇','🥈','🥉'][i]||''} ${i+1}</td><td class="p-3">${s.pseudo}</td><td class="p-3 font-bold text-nuit">${v}</td></tr>`; }); html+=sl.length===0?`<tr><td colspan="3" class="p-4 text-center text-ink/40">Aucun score</td></tr>`:''; document.getElementById('mini-leaderboard-content').innerHTML=html+'</table>'; });
    };

    window.loadLeaderboard = function() {
        window.goToStep('step-leaderboard'); document.getElementById('lb-time').value='week';
        const vm=['sudden-death','time-attack','time-attack-weighted'];
        if(gameMode&&vm.includes(gameMode)){ document.getElementById('lb-mode').value=gameMode; if(gameMode!=='time-attack-weighted') document.getElementById('lb-level').value=selectedLevel; }
        else { document.getElementById('lb-mode').value='sudden-death'; document.getElementById('lb-level').value='A1'; }
        document.getElementById('lb-time').disabled=true; document.getElementById('lb-mode').disabled=true; document.getElementById('lb-level').disabled=true;
        document.getElementById('leaderboard-content').innerHTML=`<p class="text-center text-ink/40 py-8">Chargement...</p>`;
        database.ref('scores').once('value').then(snap=>{ firebaseScores=[]; snap.forEach(c=>firebaseScores.push(c.val())); document.getElementById('lb-time').disabled=false; document.getElementById('lb-mode').disabled=false; document.getElementById('lb-level').disabled=false; window.updateLeaderboardView(); }).catch(()=>{ document.getElementById('leaderboard-content').innerHTML='<p class="text-center text-red-500 py-8">Erreur de connexion</p>'; });
    };

    window.updateLeaderboardView = function() {
        if(!firebaseScores.length) return;
        const tf=document.getElementById('lb-time').value, mf=document.getElementById('lb-mode').value, lf=document.getElementById('lb-level').value;
        document.getElementById('lb-level').style.display=(mf==='time-attack-weighted')?'none':'block';
        const now=Date.now();
        let flt=firebaseScores.filter(s=>{ if(getNormalizedMode(s.mode)!==getNormalizedMode(mf)) return false; if(mf!=='time-attack-weighted'&&(s.level||'').toUpperCase()!==(lf||'').toUpperCase()) return false; const ts=s.time||s.date; if(ts){ const d=now-ts; if((tf==='week'&&d>7*86400000)||(tf==='month'&&d>30*86400000)) return false; } else if(tf!=='all') return false; return true; });
        flt.sort((a,b)=>(parseInt(b.score||b.val)||0)-(parseInt(a.score||a.val)||0));
        let html=`<table class="w-full text-sm rounded-[1rem] overflow-hidden border border-ink/5"><tr class="bg-nuit text-white"><th class="p-3 text-left">#</th><th class="p-3 text-left">Nom</th><th class="p-3 text-left">Score</th></tr>`;
        flt.slice(0,10).forEach((s,i)=>{ let v=s.score||s.val; html+=`<tr class="border-b border-ink/5"><td class="p-3">${['🥇','🥈','🥉'][i]||''} ${i+1}</td><td class="p-3">${s.pseudo}</td><td class="p-3 font-bold text-nuit">${mf==='time-attack-weighted'?v+' pts':v}</td></tr>`; });
        html+=flt.length===0?`<tr><td colspan="3" class="p-4 text-center text-ink/40">Aucun score</td></tr>`:'';
        document.getElementById('leaderboard-content').innerHTML=html+'</table>';
    };

    window.openCustomMode = function() {
        selectedLevel='Custom'; customWeights={};
        document.getElementById('tense-buttons').innerHTML=''; document.getElementById('custom-sliders-container').innerHTML='';
        Object.keys(tenseMap).forEach(t=>{ let btn=document.createElement('button'); btn.className='btn-choice tense-toggle rounded-[1.5rem] border border-ink/5 bg-white px-4 py-4 text-sm font-semibold text-ink shadow-[0_2px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.06)] transition-all active:scale-[0.98] text-center'; btn.dataset.tense=t; btn.innerText=currentLang==='ko'?tenseMap[t].ko:t; btn.onclick=function(){ window.toggleCustomTense(this,t); }; document.getElementById('tense-buttons').appendChild(btn); });
        document.getElementById('label-tenses').innerText=currentLang==='ko'?"연습할 시제를 선택하세요":"Choisissez les temps :";
        document.getElementById('btn-custom-next').innerText=currentLang==='ko'?"다음 ➔":"Suivant ➔";
        window.goToStep('step-custom');
    };

    window.toggleCustomTense = function(btn,tense) {
        btn.classList.toggle('selected');
        let sel=Array.from(document.querySelectorAll('.tense-toggle.selected')).map(b=>b.dataset.tense);
        customWeights={}; let c=sel.length;
        if(c>0){ let base=Math.floor(100/c), rem=100%c; sel.forEach((t,i)=>customWeights[t]=base+(i<rem?1:0)); }
        window.renderCustomSliders();
    };

    window.renderCustomSliders = function() {
        let ct=document.getElementById('custom-sliders-container'); let ks=Object.keys(customWeights);
        if(ks.length<2){ ct.innerHTML=''; return; }
        let html='<div class="border-t border-dashed border-ink/10 mt-4 pt-4"><p class="text-center font-display text-lg text-nuit mb-3">'+(currentLang==='ko'?'시제 출제 확률 설정':'Réglez les probabilités')+'</p>';
        ks.forEach(k=>{ html+=`<div class="mb-3"><div class="flex justify-between text-sm font-medium mb-1"><span>${currentLang==='ko'?tenseMap[k].ko:k}</span><span id="val-${k.replace(/\s/g,'')}" class="text-gold">${customWeights[k]}%</span></div><input type="range" min="0" max="100" value="${customWeights[k]}" oninput="window.updateCustomWeight('${k}',this.value)" class="w-full"></div>`; });
        ct.innerHTML=html+'</div>';
    };

    window.updateCustomWeight = function(changed,val) {
        val=parseInt(val); let others=Object.keys(customWeights).filter(k=>k!==changed); let oldSum=others.reduce((a,b)=>a+customWeights[b],0);
        customWeights[changed]=val; let target=100-val;
        if(others.length>0){ if(oldSum===0){ let sh=target/others.length; others.forEach(k=>customWeights[k]=sh); } else { others.forEach(k=>customWeights[k]=(customWeights[k]/oldSum)*target); } }
        let fin={}, tt=0; Object.keys(customWeights).forEach(k=>{ fin[k]=Math.round(customWeights[k]); tt+=fin[k]; }); if(100-tt!==0&&others.length>0) fin[others[0]]+=100-tt; customWeights=fin;
        Object.keys(customWeights).forEach(k=>{ let sl=document.querySelector(`input[oninput*="'${k}'"]`); let lb=document.getElementById(`val-${k.replace(/\s/g,'')}`); if(sl) sl.value=customWeights[k]; if(lb) lb.innerText=customWeights[k]+'%'; });
    };

    window.confirmCustomTenses = function() { selectedTenses=Object.keys(customWeights); if(!selectedTenses.length){ alert(currentLang==='ko'?"최소 하나의 시제를 선택해주세요.":"Veuillez choisir au moins un temps."); return; } window.goToStep('step-quantity'); };

    window.updateSuggestions = function() {
        const q=document.getElementById('search-input').value.trim().toLowerCase(); const box=document.getElementById('suggestions'); const res=document.getElementById('conj-results');
        if(q.length<1){ box.style.display='none'; res.innerHTML=''; return; }
        let matches=fullDatabase.filter(v=>v.verbe.toLowerCase().startsWith(q)).slice(0,5);
        box.innerHTML=''; box.style.display=matches.length?'block':'none';
        matches.forEach(v=>{ let d=document.createElement('div'); d.className='px-4 py-3 cursor-pointer border-b border-ink/5 hover:bg-cream'; d.innerText=v.verbe+(v.traduction?` (${v.traduction})`:''); d.onclick=()=>{ document.getElementById('search-input').value=v.verbe; box.style.display='none'; window.showConjugation(v); }; box.appendChild(d); });
    };

    window.showConjugation = function(v) {
        let html=`<h2 class="font-display text-3xl text-nuit text-center uppercase">${v.verbe}</h2>`;
        if(v.traduction) html+=`<p class="text-center text-ink/40 italic -mt-1 mb-4">${v.traduction}</p>`;
        Object.keys(v.conjugaisons).forEach(t=>{ html+=`<div class="rounded-[1.5rem] border border-ink/5 bg-white p-5 mb-4"><h3 class="font-display text-lg text-nuit mb-2">${currentLang==='ko'?tenseMap[t].ko:t}</h3><table class="w-full text-sm">`; v.conjugaisons[t].forEach((raw,idx)=>{ if(raw){ const fm=getValidForms(raw); const df=fm.join(' / '); html+=`<tr class="border-b border-ink/5"><td class="p-2 text-nuit/60 w-2/5">${window.getPronoun(idx,fm[0],t)}</td><td class="p-2">${df}</td></tr>`; } }); html+=`</table></div>`; });
        document.getElementById('conj-results').innerHTML=html;
    };

    window.insertChar = function(c){ let i=document.getElementById('answer-input'); i.value+=c; i.focus(); };

    window.resetToMenu = function() {
        if(timerInterval) clearInterval(timerInterval);
        currentV=null; currentTense=null; currentPIdx=null; score=0; total=0; correctAnswers=0; mistakeTracker=[]; playedVerbs=[]; timeLeft=0; currentStreak=0;
        document.getElementById('game-timer').style.display='none'; document.getElementById('btn-stop-infinite').style.display='none';
        window.goToStep('step-main-menu');
    };

    window.loadGamificationData = function() {
        if(!studentName) return;
        const nl=studentName.toLowerCase(); const info=getLevelInfo(userXP);
        document.getElementById('gamification-rank').innerHTML=`<p class="font-display text-2xl text-white">${info.title}</p><p class="text-gold text-2xl font-bold mt-1">${userXP} XP</p><p class="text-white/50 text-sm mt-1">Niveau ${info.level} · Prochain rang : ${info.nextRankXP} XP</p>`;
        database.ref('users/'+nl+'/achievements').once('value').then(snap=>{ const ach=snap.val()||{}; let html=''; ACHIEVEMENTS.forEach(a=>{ const u=ach[a.key]===true; html+=`<div class="flex items-center justify-between rounded-[1rem] border border-ink/5 ${u?'bg-gold/5':'bg-cream opacity-50'} px-4 py-3"><div><span class="text-xl mr-2">${a.icon}</span><span class="font-medium text-ink">${a.name}</span><br><small class="text-ink/40">${a.desc}</small></div><span class="text-lg">${u?'✅':'🔒'}</span></div>`; }); document.getElementById('gamification-achievements').innerHTML=html; });
        database.ref('users').orderByChild('xp').limitToLast(10).once('value').then(snap=>{ const us=[]; snap.forEach(c=>us.push({name:c.key,xp:c.val().xp||0})); us.sort((a,b)=>b.xp-a.xp); let html=`<table class="w-full text-sm rounded-[1rem] overflow-hidden border border-ink/5"><tr class="bg-nuit text-white"><th class="p-3 text-left">#</th><th class="p-3 text-left">Nom</th><th class="p-3 text-left">XP</th></tr>`; us.forEach((u,i)=>{ html+=`<tr class="border-b border-ink/5"><td class="p-3">${i+1}</td><td class="p-3">${u.name}</td><td class="p-3 font-semibold text-gold">${u.xp}</td></tr>`; }); html+=us.length===0?`<tr><td colspan="3" class="p-4 text-center text-ink/40">Aucun joueur</td></tr>`:''; document.getElementById('rank-leaderboard').innerHTML=html+'</table>'; });
    };

    fetch('verbes.json').then(r=>r.json()).then(d=>{ fullDatabase=d; });
    document.addEventListener('keypress', e=>{ if(e.key==='Enter' && document.querySelector('.step.active') && document.querySelector('.step.active').id==='step-game') window.checkAnswer(); });
</script>
</body>
</html>
