<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conju-Coach DELF Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { display: ['Playfair Display','serif'], body: ['Inter','Noto Sans KR','sans-serif'] },
                    colors: {
                        primary: '#3498db', dark: '#2c3e50', accent: '#f39c12',
                        success: '#2ecc71', error: '#e74c3c', bg: '#f4f7f6',
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family:'Inter','Noto Sans KR',sans-serif; background:#f4f7f6; color:#2c3e50; }
        .step { display:none; flex-direction:column; gap:15px; animation:fadeIn .3s; }
        .step.active { display:flex; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .card-menu { transition: all .2s; }
        .card-menu:active { transform:scale(.97); }
        .badge { display:inline-block; padding:4px 14px; border-radius:999px; font-size:.8rem; font-weight:600; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<div class="w-[95%] max-w-[580px] rounded-[1.5rem] bg-white shadow-[0_10px_40px_rgba(0,0,0,0.08)] p-6 sm:p-8 my-6">

    <h1 class="font-display text-2xl font-bold text-center text-dark mb-6">Conju-Coach ✍️</h1>

    <!-- 0. LANGUE -->
    <div id="step-lang" class="step active">
        <p class="text-center text-dark/70 mb-2">Choisissez votre langue<br><span class="text-sm text-dark/40">언어를 선택하세요</span></p>
        <div class="grid grid-cols-2 gap-4">
            <button class="card-menu rounded-2xl border-2 border-blue-100 bg-blue-50/50 px-4 py-8 text-center hover:border-primary hover:shadow-md" onclick="window.setLang('fr')">
                <div class="text-4xl mb-2">🇫🇷</div><div class="font-semibold text-dark">Français</div>
            </button>
            <button class="card-menu rounded-2xl border-2 border-blue-100 bg-blue-50/50 px-4 py-8 text-center hover:border-primary hover:shadow-md" onclick="window.setLang('ko')">
                <div class="text-4xl mb-2">🇰🇷</div><div class="font-semibold text-dark">한국어</div>
            </button>
        </div>
    </div>

    <!-- 1. LOGIN -->
    <div id="step-login" class="step">
        <div class="text-center mb-4">
            <div class="text-5xl mb-3">👋</div>
            <p id="label-login" class="text-xl font-bold text-dark">Qui est là ?</p>
        </div>
        <input type="text" id="student-name-input" autocomplete="off" placeholder="Ton prénom ici" class="rounded-xl border-2 border-gray-100 bg-bg px-5 py-4 text-center text-lg text-dark outline-none focus:border-primary/30 transition-all">
        <button class="btn-full rounded-xl bg-primary px-6 py-4 text-base font-semibold text-white shadow-md hover:shadow-lg hover:-translate-y-[1px] transition-all" onclick="window.validateStudent()">C'est parti !</button>
        <p id="login-status" class="text-center text-sm text-dark/40 italic"></p>
    </div>

    <!-- 2. MENU — cartes avec icônes + descriptions -->
    <div id="step-main-menu" class="step">
        <div class="grid grid-cols-2 gap-3">
            <button class="card-menu rounded-2xl border-2 border-blue-100 bg-gradient-to-br from-blue-50 to-white p-5 text-center hover:border-primary hover:shadow-lg" onclick="window.goToStep('step-level')">
                <div class="text-3xl mb-2">🎯</div>
                <div class="font-bold text-sm text-dark">Entraînement<br>Classique</div>
                <div class="text-[11px] text-dark/40 mt-1">S'entraîner librement</div>
            </button>
            <button class="card-menu rounded-2xl border-2 border-amber-100 bg-gradient-to-br from-amber-50 to-white p-5 text-center hover:border-accent hover:shadow-lg" onclick="window.goToStep('step-challenges')">
                <div class="text-3xl mb-2">🔥</div>
                <div class="font-bold text-sm text-dark">Challenges</div>
                <div class="text-[11px] text-dark/40 mt-1">Défis chronométrés</div>
            </button>
            <button class="card-menu rounded-2xl border-2 border-slate-100 bg-gradient-to-br from-slate-50 to-white p-5 text-center hover:border-dark hover:shadow-lg" onclick="window.goToStep('step-conj')">
                <div class="text-3xl mb-2">📖</div>
                <div class="font-bold text-sm text-dark">Conjugueur</div>
                <div class="text-[11px] text-dark/40 mt-1">Chercher un verbe</div>
            </button>
            <button class="card-menu rounded-2xl border-2 border-emerald-100 bg-gradient-to-br from-emerald-50 to-white p-5 text-center hover:border-success hover:shadow-lg" onclick="window.goToStep('step-gamification')">
                <div class="text-3xl mb-2">🏆</div>
                <div class="font-bold text-sm text-dark">Rangs & Succès</div>
                <div class="text-[11px] text-dark/40 mt-1">Mon progrès</div>
            </button>
        </div>
        <button id="btn-menu-classic" class="hidden" onclick="window.goToStep('step-level')"></button>
        <button id="btn-menu-challenge" class="hidden" onclick="window.goToStep('step-challenges')"></button>
        <button id="btn-menu-conj" class="hidden" onclick="window.goToStep('step-conj')"></button>
        <button id="btn-menu-gamification" class="card-menu rounded-xl bg-dark px-6 py-4 text-sm font-semibold text-white shadow-md hover:shadow-lg transition-all text-center mt-3" onclick="window.goToStep('step-gamification')">🏆 Rangs & Succès</button>
        <button id="btn-menu-lb" class="card-menu rounded-xl border-2 border-gray-100 bg-bg px-6 py-4 text-sm font-semibold text-dark/70 hover:bg-gray-100 transition-all text-center" onclick="window.loadLeaderboard()">🏆 Classements</button>
    </div>

    <!-- 3. GAMIFICATION -->
    <div id="step-gamification" class="step">
        <h2 class="text-xl font-bold text-center text-dark">🏆 Mon Progrès</h2>
        <div id="gamification-rank" class="rounded-2xl bg-gradient-to-br from-primary to-dark p-8 text-center"></div>
        <h3 class="text-lg font-bold text-center text-dark mt-2">🏅 Succès</h3>
        <div id="gamification-achievements" class="flex flex-col gap-2"></div>
        <h3 class="text-lg font-bold text-center text-dark mt-3">🏅 Classement des rangs</h3>
        <div id="rank-leaderboard"></div>
        <button class="rounded-xl bg-bg px-6 py-4 text-base font-medium text-dark/50 hover:bg-gray-200 transition-all text-center" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 4. NIVEAU — cartes colorées -->
    <div id="step-level" class="step">
        <h2 id="label-level" class="text-lg font-bold text-center text-dark">-</h2>
        <div class="grid grid-cols-2 gap-3">
            <button class="card-menu rounded-2xl border-2 border-green-100 bg-green-50/50 px-4 py-6 text-center hover:border-green-400 hover:shadow-md transition-all" onclick="window.selectLevel('A1')">
                <div class="text-2xl mb-1">🌱</div><div class="font-bold text-dark">A1</div><div class="text-[11px] text-dark/40">Débutant</div>
            </button>
            <button class="card-menu rounded-2xl border-2 border-blue-100 bg-blue-50/50 px-4 py-6 text-center hover:border-primary hover:shadow-md transition-all" onclick="window.selectLevel('A2')">
                <div class="text-2xl mb-1">📘</div><div class="font-bold text-dark">A2</div><div class="text-[11px] text-dark/40">Élémentaire</div>
            </button>
            <button class="card-menu rounded-2xl border-2 border-amber-100 bg-amber-50/50 px-4 py-6 text-center hover:border-accent hover:shadow-md transition-all" onclick="window.selectLevel('B1')">
                <div class="text-2xl mb-1">📙</div><div class="font-bold text-dark">B1</div><div class="text-[11px] text-dark/40">Intermédiaire</div>
            </button>
            <button class="card-menu rounded-2xl border-2 border-red-100 bg-red-50/50 px-4 py-6 text-center hover:border-error hover:shadow-md transition-all" onclick="window.selectLevel('B2')">
                <div class="text-2xl mb-1">📕</div><div class="font-bold text-dark">B2</div><div class="text-[11px] text-dark/40">Avancé</div>
            </button>
        </div>
        <button id="btn-custom-trigger" class="card-menu rounded-2xl border-2 border-purple-100 bg-purple-50/50 px-4 py-5 text-center w-full hover:border-purple-400 hover:shadow-md transition-all">
            <div class="flex items-center justify-center gap-2">
                <span class="text-xl">⚙️</span>
                <span class="font-semibold text-dark" id="btn-custom-trigger-text">Personnalisé</span>
            </div>
        </button>
        <button class="rounded-xl bg-bg px-6 py-4 text-base font-medium text-dark/50 hover:bg-gray-200 transition-all text-center" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 5. CHALLENGES — cartes descriptives -->
    <div id="step-challenges" class="step">
        <h2 class="text-lg font-bold text-center text-dark">🔥 Modes de Jeu</h2>
        <div class="flex flex-col gap-3">
            <button id="btn-mode-sd" class="card-menu challenge-btn rounded-2xl border-2 border-red-100 bg-red-50/50 p-4 text-left flex items-center gap-4 hover:border-error hover:shadow-md transition-all" onclick="window.selectChallengeMode('sudden-death', this)">
                <div class="text-3xl">☠️</div>
                <div>
                    <div class="font-bold text-dark"><span id="txt-sd">Mort Subite</span></div>
                    <div class="text-[11px] text-dark/40">1 erreur = partie terminée</div>
                </div>
            </button>
            <button id="btn-mode-ta" class="card-menu challenge-btn rounded-2xl border-2 border-blue-100 bg-blue-50/50 p-4 text-left flex items-center gap-4 hover:border-primary hover:shadow-md transition-all" onclick="window.selectChallengeMode('time-attack', this)">
                <div class="text-3xl">⏱️</div>
                <div>
                    <div class="font-bold text-dark"><span id="txt-ta">Time Attack</span></div>
                    <div class="text-[11px] text-dark/40">60 secondes pour marquer</div>
                </div>
            </button>
            <button id="btn-mode-ta-all" class="card-menu challenge-btn rounded-2xl border-2 border-amber-100 bg-amber-50/50 p-4 text-left flex items-center gap-4 hover:border-accent hover:shadow-md transition-all w-full" onclick="window.selectChallengeMode('time-attack-weighted', this)">
                <div class="text-3xl">🌟</div>
                <div>
                    <div class="font-bold text-dark"><span id="txt-ta-all">Time Attack (Tous verbes)</span></div>
                    <div class="text-[11px] text-dark/40">Points pondérés : A1=1 A2=2 B1=3 B2=5</div>
                </div>
            </button>
        </div>
        <div id="challenge-level-select" style="display:none; border-top:1px dashed #ddd; padding-top:16px; margin-top:8px;">
            <p id="label-challenge-lvl" class="text-sm font-semibold text-center text-dark/60 mb-3">Choisissez le niveau :</p>
            <div class="grid grid-cols-4 gap-2">
                <button class="card-menu rounded-xl border-2 border-blue-100 bg-blue-50/50 px-3 py-3 text-center font-bold text-dark hover:border-primary hover:shadow-sm transition-all" onclick="window.startChallengeGame('A1')">A1</button>
                <button class="card-menu rounded-xl border-2 border-blue-100 bg-blue-50/50 px-3 py-3 text-center font-bold text-dark hover:border-primary hover:shadow-sm transition-all" onclick="window.startChallengeGame('A2')">A2</button>
                <button class="card-menu rounded-xl border-2 border-blue-100 bg-blue-50/50 px-3 py-3 text-center font-bold text-dark hover:border-primary hover:shadow-sm transition-all" onclick="window.startChallengeGame('B1')">B1</button>
                <button class="card-menu rounded-xl border-2 border-blue-100 bg-blue-50/50 px-3 py-3 text-center font-bold text-dark hover:border-primary hover:shadow-sm transition-all" onclick="window.startChallengeGame('B2')">B2</button>
            </div>
        </div>
        <button class="rounded-xl bg-bg px-6 py-4 text-base font-medium text-dark/50 hover:bg-gray-200 transition-all text-center" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 6. CUSTOM -->
    <div id="step-custom" class="step">
        <p id="label-tenses" class="text-center font-semibold text-dark">-</p>
        <div class="grid grid-cols-2 gap-3" id="tense-buttons"></div>
        <div id="custom-sliders-container"></div>
        <button id="btn-custom-next" class="rounded-xl bg-primary px-6 py-4 text-base font-semibold text-white shadow-md hover:shadow-lg transition-all text-center" onclick="window.confirmCustomTenses()">-</button>
        <button class="rounded-xl bg-bg px-6 py-4 text-base font-medium text-dark/50 hover:bg-gray-200 transition-all text-center" onclick="window.goToStep('step-level')">➔ Retour</button>
    </div>

    <!-- 7. CLASSEMENT -->
    <div id="step-leaderboard" class="step">
        <h2 id="label-lb-title" class="text-lg font-bold text-center text-dark">🏆 Top Scores</h2>
        <div class="flex gap-2">
            <select id="lb-time" onchange="window.updateLeaderboardView()" class="flex-1 rounded-lg border border-gray-200 bg-bg px-3 py-2.5 text-sm font-medium text-dark/70 outline-none focus:border-primary/30">
                <option id="opt-time-week" value="week">Semaine</option>
                <option id="opt-time-month" value="month">Mois</option>
                <option id="opt-time-all" value="all">All-Time</option>
            </select>
            <select id="lb-mode" onchange="window.updateLeaderboardView()" class="flex-1 rounded-lg border border-gray-200 bg-bg px-3 py-2.5 text-sm font-medium text-dark/70 outline-none focus:border-primary/30">
                <option id="opt-mode-sd" value="sudden-death">Mort Subite</option>
                <option id="opt-mode-ta" value="time-attack">Time Attack</option>
                <option id="opt-mode-ta-all" value="time-attack-weighted">Time Attack (Tous)</option>
            </select>
        </div>
        <select id="lb-level" onchange="window.updateLeaderboardView()" class="rounded-lg border border-gray-200 bg-bg px-3 py-2.5 text-sm font-medium text-dark/70 outline-none focus:border-primary/30">
            <option value="A1">Niveau A1</option><option value="A2">Niveau A2</option><option value="B1">Niveau B1</option><option value="B2">Niveau B2</option>
        </select>
        <div id="leaderboard-content" style="min-height:200px; overflow-y:auto;"></div>
        <button class="rounded-xl bg-bg px-6 py-4 text-base font-medium text-dark/50 hover:bg-gray-200 transition-all text-center" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>

    <!-- 8. QUANTITÉ -->
    <div id="step-quantity" class="step">
        <p id="label-quantity" class="text-center font-semibold text-dark text-lg">-</p>
        <input type="number" id="nb-verbes" value="10" min="1" max="50" class="rounded-xl border-2 border-gray-100 bg-bg px-5 py-4 text-center text-lg text-dark outline-none focus:border-primary/20 transition-all">
        <div class="flex gap-3">
            <button id="btn-infinite" class="card-menu rounded-xl border-2 border-gray-100 bg-white px-5 py-4 text-base font-semibold text-dark/60 hover:border-primary/30 hover:shadow-sm transition-all flex-1 text-center" onclick="window.startClassic(999)">-</button>
            <button id="btn-start" class="rounded-xl bg-primary px-6 py-4 text-base font-semibold text-white shadow-md hover:shadow-lg hover:-translate-y-[1px] transition-all flex-[2] text-center" onclick="window.startClassic()"></button>
        </div>
    </div>

    <!-- 9. JEU — layout retravaillé -->
    <div id="step-game" class="step">
        <!-- Barre de progression -->
        <div class="w-full bg-gray-100 rounded-full h-2.5">
            <div id="game-progress-bar" class="bg-primary h-2.5 rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
        <div class="flex justify-between items-center">
            <div id="game-progress" class="text-sm font-semibold text-dark/60">0 / 10</div>
            <div id="game-timer" class="hidden"><span class="badge bg-error text-white">⏳ 01:00</span></div>
        </div>
        <!-- Carte verbe -->
        <div class="rounded-2xl border border-gray-100 bg-white overflow-hidden shadow-sm">
            <!-- En-tête temps -->
            <div class="bg-gradient-to-r from-primary to-dark/80 px-6 py-3 text-center">
                <div id="tense-display" class="text-white font-bold text-lg">-</div>
            </div>
            <!-- Contenu -->
            <div class="p-6 text-center">
                <div id="verb-name" class="text-3xl font-bold text-dark uppercase tracking-wide">---</div>
                <span id="verb-traduction" class="block text-sm text-dark/35 italic mt-1 mb-4"></span>
                <div id="pronoun" class="text-xl font-semibold text-primary mb-3">---</div>
                <input type="text" id="answer-input" autocomplete="off" spellcheck="false" class="rounded-xl border-2 border-gray-100 bg-bg w-full py-3.5 text-center text-xl text-dark outline-none focus:border-primary/30 transition-all">
                <!-- Clavier -->
                <div class="flex justify-center gap-1.5 flex-wrap mt-4">
                    <button class="key rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-base font-semibold text-dark/70 shadow-sm hover:bg-primary/5 hover:border-primary/30 transition-all" onclick="window.insertChar('é')">é</button>
                    <button class="key rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-base font-semibold text-dark/70 shadow-sm hover:bg-primary/5 hover:border-primary/30 transition-all" onclick="window.insertChar('è')">è</button>
                    <button class="key rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-base font-semibold text-dark/70 shadow-sm hover:bg-primary/5 hover:border-primary/30 transition-all" onclick="window.insertChar('à')">à</button>
                    <button class="key rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-base font-semibold text-dark/70 shadow-sm hover:bg-primary/5 hover:border-primary/30 transition-all" onclick="window.insertChar('â')">â</button>
                    <button class="key rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-base font-semibold text-dark/70 shadow-sm hover:bg-primary/5 hover:border-primary/30 transition-all" onclick="window.insertChar('ç')">ç</button>
                    <button class="key rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-base font-semibold text-dark/70 shadow-sm hover:bg-primary/5 hover:border-primary/30 transition-all" onclick="window.insertChar('ê')">ê</button>
                    <button class="key rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-base font-semibold text-dark/70 shadow-sm hover:bg-primary/5 hover:border-primary/30 transition-all" onclick="window.insertChar('î')">î</button>
                </div>
            </div>
        </div>
        <button id="btn-submit" class="rounded-xl bg-primary px-6 py-4 text-base font-semibold text-white shadow-md hover:shadow-lg hover:-translate-y-[1px] transition-all text-center" onclick="window.checkAnswer()">Vérifier</button>
        <button id="btn-stop-infinite" class="hidden rounded-xl bg-bg px-6 py-4 text-base font-medium text-dark/50 hover:bg-gray-200 transition-all text-center" onclick="window.stopGame()">Terminer</button>
        <div id="feedback" class="min-h-[36px] text-center font-semibold text-lg"></div>
    </div>

    <!-- 10. RÉSULTATS — layout retravaillé -->
    <div id="step-results" class="step">
        <!-- Hero score -->
        <div class="rounded-2xl bg-gradient-to-br from-primary to-dark p-8 text-center">
            <div id="final-score" class="text-5xl font-bold text-white">0</div>
            <p id="final-percent" class="font-semibold text-white/70 text-lg mt-2">-</p>
        </div>
        <!-- Mini classement -->
        <div id="results-leaderboard" style="display:none;">
            <h3 id="label-top10" class="text-lg font-bold text-center text-dark mt-4 mb-2">🏆 Top 10 Actuel</h3>
            <div id="mini-leaderboard-content"></div>
        </div>
        <!-- Partage -->
        <div class="rounded-2xl border border-gray-100 bg-bg p-4">
            <textarea id="user-comment" rows="2" placeholder="Un petit message ?" class="rounded-xl border border-gray-200 bg-white w-full px-4 py-3 text-sm text-dark outline-none focus:border-primary/20 mb-2"></textarea>
            <button id="btn-kakao" class="rounded-xl bg-accent px-6 py-3.5 text-base font-semibold text-white shadow-md hover:shadow-lg hover:-translate-y-[1px] transition-all text-center w-full" onclick="window.sendKakao()" style="background:#f39c12"></button>
        </div>
        <!-- Recommencer -->
        <button id="btn-restart" class="rounded-xl border-2 border-gray-100 bg-white px-6 py-4 text-base font-semibold text-dark/60 hover:bg-bg hover:border-dark/10 transition-all text-center" onclick="window.resetToMenu()">Recommencer</button>
        <!-- Fautes -->
        <div id="mistake-container"></div>
    </div>

    <!-- 11. CONJUGUEUR -->
    <div id="step-conj" class="step">
        <div class="text-center mb-2">
            <div class="text-3xl mb-2">📖</div>
            <p id="label-search" class="font-semibold text-dark">-</p>
        </div>
        <input type="text" id="search-input" oninput="window.updateSuggestions()" autocomplete="off" class="rounded-xl border-2 border-gray-100 bg-bg px-5 py-4 text-center text-base text-dark outline-none focus:border-primary/20 transition-all">
        <div id="suggestions" style="display:none; max-height:100px; overflow:auto;" class="rounded-xl border border-gray-100 bg-white shadow-md"></div>
        <div id="conj-results" style="margin-top:15px; overflow-y:auto; max-height:320px;"></div>
        <button class="rounded-xl bg-bg px-6 py-4 text-base font-medium text-dark/50 hover:bg-gray-200 transition-all text-center" onclick="window.goToStep('step-main-menu')">➔ Retour</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAG9xp3A4pdA-Cbt1qh8uM4tfC7f_1-MXY",

                if(selectedLevel==="A1"&&validVerbs.length>0){ let wi=Math.random()<0.5, f=validVerbs.filter(v=>config.irreguliers.includes(v.verbe.toLowerCase())===wi); if(f.length>0) validVerbs=f; }
            }
            if(validVerbs.length>0){ let up=validVerbs.filter(v=>!playedVerbs.includes(v.verbe+'-'+tempTense)); if(up.length>0) validVerbs=up; currentV=validVerbs[Math.floor(Math.random()*validVerbs.length)]; currentTense=tempTense; playedVerbs.push(currentV.verbe+'-'+currentTense+'-'+currentV.niveau); valid=true; }

    window.stopGame = function(){ if(timerInterval) clearInterval(timerInterval); window.showResults(); };

    window.showResults = function() {
        if(timerInterval) clearInterval(timerInterval); window.goToStep('step-results');
        if(mistakeTracker.length===0) addXP(20); if(gameMode!=='classic') addXP(10); if(gameMode.includes('time-attack')&&timeLeft>0) addXP(timeLeft);
        if(gameMode!=='classic') database.ref('scores').push({pseudo:studentName||"Anonyme",score:score,mode:gameMode,level:gameMode==='time-attack-weighted'?'all':selectedLevel,time:Date.now()});
        const sr=total>0?Math.round((correctAnswers/total)*100):0;
        if(gameMode==='time-attack-weighted'){ document.getElementById('final-score').innerText=`${score} pts`; document.getElementById('final-percent').innerText=`${sr}% ${i18n[currentLang].statsLabel} (${total} ${i18n[currentLang].verbsAttempted})`; }
        else if(gameMode==='time-attack'||gameMode==='sudden-death'){ document.getElementById('final-score').innerText=`${score}`; document.getElementById('final-percent').innerText=`${sr}% ${i18n[currentLang].statsLabel} (${total} ${i18n[currentLang].verbsAttempted})`; }
        else { document.getElementById('final-score').innerText=`${score} / ${total}`; document.getElementById('final-percent').innerText=`${sr}% ${i18n[currentLang].statsLabel}`; }

        const c=document.getElementById('mistake-container');
        c.innerHTML=mistakeTracker.length>0?`<h3 class="text-lg font-bold text-dark text-center mt-4 mb-2">${i18n[currentLang].reviewTitle}</h3>`:`<p class="text-center text-dark/50 font-semibold mt-3">${i18n[currentLang].perfectMsg}</p>`;
        mistakeTracker.forEach(m=>{
            const dt=(currentLang==='ko')?(tenseMap[m.tense]?.ko||m.tense):m.tense;
            let h=`<div class="rounded-2xl border border-gray-100 bg-white p-5 mb-3"><h3 class="font-bold text-dark mb-2">${m.verb.verbe} <span class="badge bg-primary/10 text-primary">${dt}</span></h3><table class="w-full text-sm">`;
            m.verb.conjugaisons[m.tense].forEach((raw,idx)=>{
                if(raw){ const fm=getValidForms(raw); const df=fm.join(' / ');
                    h+=`<tr class="${idx===m.errorIdx?'bg-red-50 text-red-500 font-semibold':'border-b border-gray-50'}"><td class="p-2 text-dark/50">${window.getPronoun(idx,fm[0],m.tense)}</td><td class="p-2">${df}</td></tr>`;
                }
            });
            c.innerHTML+=h+"</table></div>";
        });
        checkAchievements();
        if(isAuthorizedStudent) saveDetailedReport();
        if(gameMode!=='classic') window.loadMiniLeaderboard(); else document.getElementById('results-leaderboard').style.display='none';
    };

    function saveDetailedReport() {
        database.ref('studentReports/'+studentName.toLowerCase()).push({
            student:studentName,mode:gameMode,level:gameMode==='time-attack-weighted'?'all':selectedLevel,score:score,total:total,correctAnswers:correctAnswers,successRate:total>0?Math.round((correctAnswers/total)*100):0,timestamp:Date.now(),
            mistakes:mistakeTracker.map(m=>{ const fm=getValidForms(m.verb.conjugaisons[m.tense][m.errorIdx]); return {verbe:m.verb.verbe,temps:m.tense,pronom:pronoms[m.errorIdx],formeCorrecte:fm[0],reponseEleve:m.userAnswer}; })
        });
    }

    window.sendKakao = function() {
        unlockAchievement('share_once');
        let modeKo=gameMode==='classic'?'기본 연습':gameMode==='sudden-death'?'서든 데스':gameMode==='time-attack'?'타임 어택':'타임 어택 (모든 동사)';
        let modeFr=gameMode==='classic'?'Classique':gameMode==='sudden-death'?'Mort Subite':gameMode==='time-attack'?'Time Attack':'Time Attack (Tous les verbes)';
        let uc=document.getElementById('user-comment').value, ld=selectedLevel==='all'?'Tous / 전체':selectedLevel;
        const sr=total>0?Math.round((correctAnswers/total)*100):0;
        let msg=currentLang==='ko'?`🏆 [Conju-Coach 결과]\n• 모드: ${modeKo}\n• 레벨: ${ld}\n• 점수: ${score}\n• 성공률: ${sr}%\n• 시도한 동사: ${total}\n💬 메시지: ${uc||"없음"}\n`:`🏆 [Résultat Conju-Coach]\n• Mode : ${modeFr}\n• Niveau : ${ld}\n• Score : ${score}\n• Taux de réussite : ${sr}%\n• Total tentés : ${total}\n💬 Message : ${uc||"Aucun"}\n`;
        if(mistakeTracker.length>0){ msg+=currentLang==='ko'?`\n❌ 틀린 동사 복습 :\n`:`\n❌ Erreurs à réviser :\n`; mistakeTracker.forEach(m=>{ const fm=getValidForms(m.verb.conjugaisons[m.tense][m.errorIdx]); const p=window.getPronoun(m.errorIdx,fm[0],m.tense).trim(); msg+=`- ${m.verb.verbe.toUpperCase()} (${m.tense}) -> ${p} ${fm.join('/')}\n`; }); }
        else { msg+=currentLang==='ko'?`\n🏆 오답 없음!`:`\n🏆 Zéro faute ! Parfait !`; }
        if(navigator.share){ navigator.share({title:'Conju-Coach',text:msg}).catch(()=>fallbackCopy(msg)); } else { fallbackCopy(msg); }
    };
    function fallbackCopy(text) { const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); alert(currentLang==='ko'?"복사되었습니다! 💛":"Copié ! 💛"); } catch(e){ alert("Erreur de copie."); } document.body.removeChild(ta); }

    window.loadMiniLeaderboard = function() {
        document.getElementById('results-leaderboard').style.display='block';
        document.getElementById('mini-leaderboard-content').innerHTML=`<p class="text-center text-dark/30 py-4">Chargement...</p>`;
        database.ref('scores').once('value').then(snap=>{ let sl=[]; snap.forEach(c=>{ let s=c.val(); let el=(gameMode==='time-attack-weighted')?'all':selectedLevel; if(getNormalizedMode(s.mode)===getNormalizedMode(gameMode)&&s.level===el) sl.push(s); }); sl.sort((a,b)=>(parseInt(b.score||b.val)||0)-(parseInt(a.score||a.val)||0)); let html=`<table class="w-full text-sm rounded-xl overflow-hidden border border-gray-100"><tr class="bg-dark text-white"><th class="p-2.5 text-left">#</th><th class="p-2.5 text-left">Nom</th><th class="p-2.5 text-left">Score</th></tr>`; sl.slice(0,10).forEach((s,i)=>{ let v=gameMode==='time-attack-weighted'?`${s.score||s.val} pts`:(s.score||s.val); html+=`<tr class="border-b border-gray-50"><td class="p-2.5">${['🥇','🥈','🥉'][i]||''} ${i+1}</td><td class="p-2.5">${s.pseudo}</td><td class="p-2.5 font-bold text-dark">${v}</td></tr>`; }); html+=sl.length===0?`<tr><td colspan="3" class="p-3 text-center text-dark/30">Aucun score</td></tr>`:''; document.getElementById('mini-leaderboard-content').innerHTML=html+'</table>'; });
    };

    window.loadLeaderboard = function() {
        window.goToStep('step-leaderboard'); document.getElementById('lb-time').value='week';
        const vm=['sudden-death','time-attack','time-attack-weighted'];
        if(gameMode&&vm.includes(gameMode)){ document.getElementById('lb-mode').value=gameMode; if(gameMode!=='time-attack-weighted') document.getElementById('lb-level').value=selectedLevel; }
        else { document.getElementById('lb-mode').value='sudden-death'; document.getElementById('lb-level').value='A1'; }
        document.getElementById('lb-time').disabled=true; document.getElementById('lb-mode').disabled=true; document.getElementById('lb-level').disabled=true;
        document.getElementById('leaderboard-content').innerHTML=`<p class="text-center text-dark/30 py-8">Chargement...</p>`;
        database.ref('scores').once('value').then(snap=>{ firebaseScores=[]; snap.forEach(c=>firebaseScores.push(c.val())); document.getElementById('lb-time').disabled=false; document.getElementById('lb-mode').disabled=false; document.getElementById('lb-level').disabled=false; window.updateLeaderboardView(); }).catch(()=>{ document.getElementById('leaderboard-content').innerHTML='<p class="text-center text-red-500 py-8">Erreur de connexion</p>'; });
    };

    window.updateLeaderboardView = function() {
        if(!firebaseScores.length) return;
        const tf=document.getElementById('lb-time').value, mf=document.getElementById('lb-mode').value, lf=document.getElementById('lb-level').value;
        document.getElementById('lb-level').style.display=(mf==='time-attack-weighted')?'none':'block';
        const now=Date.now();
        let flt=firebaseScores.filter(s=>{ if(getNormalizedMode(s.mode)!==getNormalizedMode(mf)) return false; if(mf!=='time-attack-weighted'&&(s.level||'').toUpperCase()!==(lf||'').toUpperCase()) return false; const ts=s.time||s.date; if(ts){ const d=now-ts; if((tf==='week'&&d>7*86400000)||(tf==='month'&&d>30*86400000)) return false; } else if(tf!=='all') return false; return true; });
        flt.sort((a,b)=>(parseInt(b.score||b.val)||0)-(parseInt(a.score||a.val)||0));
        let html=`<table class="w-full text-sm rounded-xl overflow-hidden border border-gray-100"><tr class="bg-dark text-white"><th class="p-2.5 text-left">#</th><th class="p-2.5 text-left">Nom</th><th class="p-2.5 text-left">Score</th></tr>`;
        flt.slice(0,10).forEach((s,i)=>{ let v=s.score||s.val; html+=`<tr class="border-b border-gray-50"><td class="p-2.5">${['🥇','🥈','🥉'][i]||''} ${i+1}</td><td class="p-2.5">${s.pseudo}</td><td class="p-2.5 font-bold text-dark">${mf==='time-attack-weighted'?v+' pts':v}</td></tr>`; });
        html+=flt.length===0?`<tr><td colspan="3" class="p-3 text-center text-dark/30">Aucun score</td></tr>`:'';
        document.getElementById('leaderboard-content').innerHTML=html+'</table>';
    };

    window.openCustomMode = function() {
        selectedLevel='Custom'; customWeights={}; document.getElementById('tense-buttons').innerHTML=''; document.getElementById('custom-sliders-container').innerHTML='';
        Object.keys(tenseMap).forEach(t=>{ let btn=document.createElement('button'); btn.className='tense-toggle rounded-xl border-2 border-gray-100 bg-white px-3 py-4 text-sm font-semibold text-dark/70 hover:border-primary/30 hover:shadow-sm transition-all text-center'; btn.dataset.tense=t; btn.innerText=currentLang==='ko'?tenseMap[t].ko:t; btn.onclick=function(){ window.toggleCustomTense(this,t); }; document.getElementById('tense-buttons').appendChild(btn); });
        document.getElementById('label-tenses').innerText=currentLang==='ko'?"연습할 시제를 선택하세요":"Choisissez les temps :";
        document.getElementById('btn-custom-next').innerText=currentLang==='ko'?"다음 ➔":"Suivant ➔";
        window.goToStep('step-custom');
    };

    window.toggleCustomTense = function(btn,tense) {
        btn.classList.toggle('selected'); btn.classList.toggle('bg-primary'); btn.classList.toggle('text-white'); btn.classList.toggle('border-primary');
        let sel=Array.from(document.querySelectorAll('.tense-toggle.selected')).map(b=>b.dataset.tense);
        customWeights={}; let c=sel.length;
        if(c>0){ let base=Math.floor(100/c), rem=100%c; sel.forEach((t,i)=>customWeights[t]=base+(i<rem?1:0)); }
        window.renderCustomSliders();
    };

    window.renderCustomSliders = function() {
        let ct=document.getElementById('custom-sliders-container'); let ks=Object.keys(customWeights);
        if(ks.length<2){ ct.innerHTML=''; return; }
        let html='<div class="border-t border-gray-100 mt-3 pt-3"><p class="text-center text-sm font-semibold text-dark/60 mb-2">'+(currentLang==='ko'?'시제 출제 확률 설정':'Réglez les probabilités')+'</p>';
        ks.forEach(k=>{ html+=`<div class="mb-2"><div class="flex justify-between text-xs font-medium"><span>${currentLang==='ko'?tenseMap[k].ko:k}</span><span id="val-${k.replace(/\s/g,'')}" class="text-primary font-bold">${customWeights[k]}%</span></div><input type="range" min="0" max="100" value="${customWeights[k]}" oninput="window.updateCustomWeight('${k}',this.value)" class="w-full accent-primary"></div>`; });
        ct.innerHTML=html+'</div>';
    };

    window.updateCustomWeight = function(changed,val) {
        val=parseInt(val); let others=Object.keys(customWeights).filter(k=>k!==changed); let oldSum=others.reduce((a,b)=>a+customWeights[b],0);
        customWeights[changed]=val; let target=100-val;
        if(others.length>0){ if(oldSum===0){ let sh=target/others.length; others.forEach(k=>customWeights[k]=sh); } else { others.forEach(k=>customWeights[k]=(customWeights[k]/oldSum)*target); } }
        let fin={}, tt=0; Object.keys(customWeights).forEach(k=>{ fin[k]=Math.round(customWeights[k]); tt+=fin[k]; }); if(100-tt!==0&&others.length>0) fin[others[0]]+=100-tt; customWeights=fin;
        Object.keys(customWeights).forEach(k=>{ let sl=document.querySelector(`input[oninput*="'${k}'"]`); let lb=document.getElementById(`val-${k.replace(/\s/g,'')}`); if(sl) sl.value=customWeights[k]; if(lb) lb.innerText=customWeights[k]+'%'; });
    };

    window.confirmCustomTenses = function() { selectedTenses=Object.keys(customWeights); if(!selectedTenses.length){ alert(currentLang==='ko'?"최소 하나의 시제를 선택해주세요.":"Veuillez choisir au moins un temps."); return; } window.goToStep('step-quantity'); };

    window.updateSuggestions = function() {
        const q=document.getElementById('search-input').value.trim().toLowerCase(); const box=document.getElementById('suggestions'); const res=document.getElementById('conj-results');
        if(q.length<1){ box.style.display='none'; res.innerHTML=''; return; }
        let matches=fullDatabase.filter(v=>v.verbe.toLowerCase().startsWith(q)).slice(0,5);
        box.innerHTML=''; box.style.display=matches.length?'block':'none';
        matches.forEach(v=>{ let d=document.createElement('div'); d.className='px-4 py-2.5 cursor-pointer border-b border-gray-50 hover:bg-bg text-sm'; d.innerText=v.verbe+(v.traduction?` (${v.traduction})`:''); d.onclick=()=>{ document.getElementById('search-input').value=v.verbe; box.style.display='none'; window.showConjugation(v); }; box.appendChild(d); });
    };

    window.showConjugation = function(v) {
        let html=`<h2 class="text-2xl font-bold text-dark text-center uppercase mb-3">${v.verbe}</h2>`;
        if(v.traduction) html+=`<p class="text-center text-dark/35 italic -mt-2 mb-3">${v.traduction}</p>`;
        Object.keys(v.conjugaisons).forEach(t=>{ html+=`<div class="rounded-xl border border-gray-100 bg-white p-4 mb-3"><h3 class="font-bold text-dark text-sm mb-1"><span class="badge bg-primary/10 text-primary">${currentLang==='ko'?tenseMap[t].ko:t}</span></h3><table class="w-full text-sm">`; v.conjugaisons[t].forEach((raw,idx)=>{ if(raw){ const fm=getValidForms(raw); const df=fm.join(' / '); html+=`<tr class="border-b border-gray-50"><td class="p-1.5 text-dark/50 w-2/5">${window.getPronoun(idx,fm[0],t)}</td><td class="p-1.5">${df}</td></tr>`; } }); html+=`</table></div>`; });
        document.getElementById('conj-results').innerHTML=html;
    };

    window.insertChar = function(c){ let i=document.getElementById('answer-input'); i.value+=c; i.focus(); };
    window.resetToMenu = function() {
        if(timerInterval) clearInterval(timerInterval);
        currentV=null; currentTense=null; currentPIdx=null; score=0; total=0; correctAnswers=0; mistakeTracker=[]; playedVerbs=[]; timeLeft=0; currentStreak=0;
        document.getElementById('game-timer').classList.add('hidden'); document.getElementById('btn-stop-infinite').style.display='none';
        window.goToStep('step-main-menu');
    };

    window.loadGamificationData = function() {
        if(!studentName) return;
        const nl=studentName.toLowerCase(); const info=getLevelInfo(userXP);
        document.getElementById('gamification-rank').innerHTML=`<p class="text-2xl text-white font-bold">${info.title}</p><p class="text-white text-3xl font-bold mt-1">${userXP} XP</p><p class="text-white/60 text-sm mt-1">Niveau ${info.level} · Prochain rang : ${info.nextRankXP} XP</p>`;
        database.ref('users/'+nl+'/achievements').once('value').then(snap=>{ const ach=snap.val()||{}; let html=''; ACHIEVEMENTS.forEach(a=>{ const u=ach[a.key]===true; html+=`<div class="flex items-center justify-between rounded-xl border border-gray-100 ${u?'bg-green-50/50':'bg-bg opacity-50'} px-3.5 py-2.5"><div class="flex items-center gap-2"><span class="text-lg">${a.icon}</span><div><div class="text-sm font-medium text-dark">${a.name}</div><small class="text-dark/40 text-[11px]">${a.desc}</small></div></div><span>${u?'✅':'🔒'}</span></div>`; }); document.getElementById('gamification-achievements').innerHTML=html; });
        database.ref('users').orderByChild('xp').limitToLast(10).once('value').then(snap=>{ const us=[]; snap.forEach(c=>us.push({name:c.key,xp:c.val().xp||0})); us.sort((a,b)=>b.xp-a.xp); let html=`<table class="w-full text-sm rounded-xl overflow-hidden border border-gray-100"><tr class="bg-dark text-white"><th class="p-2.5 text-left">#</th><th class="p-2.5 text-left">Nom</th><th class="p-2.5 text-left">XP</th></tr>`; us.forEach((u,i)=>{ html+=`<tr class="border-b border-gray-50"><td class="p-2.5">${i+1}</td><td class="p-2.5">${u.name}</td><td class="p-2.5 font-bold text-primary">${u.xp}</td></tr>`; }); html+=us.length===0?`<tr><td colspan="3" class="p-3 text-center text-dark/30">Aucun joueur</td></tr>`:''; document.getElementById('rank-leaderboard').innerHTML=html+'</table>'; });
    };

    fetch('verbes.json').then(r=>r.json()).then(d=>{ fullDatabase=d; });
    document.addEventListener('keypress', e=>{ if(e.key==='Enter' && document.querySelector('.step.active') && document.querySelector('.step.active').id==='step-game') window.checkAnswer(); });
</script>
</body>
</html>
